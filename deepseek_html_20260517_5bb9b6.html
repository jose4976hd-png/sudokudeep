<script>
// ==================== FUNCIONES PARA GESTIONAR FOTOS PERSONALES EN INDEXEDDB ====================
let photosDB;
const PHOTOS_STORE = 'user_photos';

function initPhotosDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('SudokuPhotosDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PHOTOS_STORE)) {
        db.createObjectStore(PHOTOS_STORE, { autoIncrement: true });
      }
    };
    req.onsuccess = e => {
      photosDB = e.target.result;
      resolve();
    };
    req.onerror = () => reject();
  });
}

// Guardar una foto (blob) en IndexedDB
function saveUserPhoto(blob) {
  return new Promise((resolve, reject) => {
    if (!photosDB) return reject();
    const tx = photosDB.transaction(PHOTOS_STORE, 'readwrite');
    const store = tx.objectStore(PHOTOS_STORE);
    const req = store.add(blob);
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

// Obtener todas las fotos guardadas (como blobs)
function getAllUserPhotos() {
  return new Promise((resolve, reject) => {
    if (!photosDB) return resolve([]);
    const tx = photosDB.transaction(PHOTOS_STORE, 'readonly');
    const store = tx.objectStore(PHOTOS_STORE);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

// Eliminar una foto por su ID (autoIncrement)
function deleteUserPhoto(id) {
  return new Promise((resolve, reject) => {
    if (!photosDB) return reject();
    const tx = photosDB.transaction(PHOTOS_STORE, 'readwrite');
    const store = tx.objectStore(PHOTOS_STORE);
    const req = store.delete(id);
    req.onsuccess = resolve;
    req.onerror = reject;
  });
}

// Al ganar, mostrar una foto aleatoria de las guardadas (o por defecto)
async function showRandomVictoryPhoto() {
  const pf = document.getElementById('pFrame');
  pf.innerHTML = '';
  const photos = await getAllUserPhotos();
  if (photos.length > 0) {
    const randomIndex = Math.floor(Math.random() * photos.length);
    const blob = photos[randomIndex];
    const url = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.src = url;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    pf.appendChild(img);
    // Liberar URL después de un tiempo (no afecta la visualización)
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } else {
    // Foto por defecto (un emoji SVG)
    const defaultEmoji = document.createElement('div');
    defaultEmoji.textContent = '🏆';
    defaultEmoji.style.fontSize = '5rem';
    defaultEmoji.style.textAlign = 'center';
    pf.appendChild(defaultEmoji);
  }
}

// Renderizar galería de fotos en el panel de ajustes
async function renderPhotoGallery() {
  const container = document.getElementById('photoGalleryContainer');
  if (!container) return;
  const photos = await getAllUserPhotos();
  container.innerHTML = '';
  if (photos.length === 0) {
    container.innerHTML = '<div class="sett-desc" style="text-align:center">Aún no has subido fotos. ¡Sube las tuyas para verlas al ganar!</div>';
    return;
  }
  // Mostrar cada foto con su miniatura y botón eliminar
  for (let i = 0; i < photos.length; i++) {
    const blob = photos[i];
    const url = URL.createObjectURL(blob);
    const div = document.createElement('div');
    div.className = 'photo-item';
    const img = document.createElement('img');
    img.src = url;
    const delBtn = document.createElement('div');
    delBtn.className = 'delete-photo';
    delBtn.textContent = '✕';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (confirm('¿Eliminar esta foto?')) {
        // Obtener la key (id) correspondiente a este blob. Como no tenemos fácil la key, necesitamos obtener la lista con ids.
        // Mejor: modificar getAllUserPhotos para que devuelva también las claves.
        // Rehacemos la función getPhotosWithKeys.
        await deleteUserPhotoByBlob(blob);
        renderPhotoGallery();
      }
    };
    div.appendChild(img);
    div.appendChild(delBtn);
    container.appendChild(div);
    URL.revokeObjectURL(url); // liberar inmediatamente porque la usaremos de nuevo luego
  }
}

// Función auxiliar para obtener fotos con sus IDs
function getAllUserPhotosWithKeys() {
  return new Promise((resolve, reject) => {
    if (!photosDB) return resolve([]);
    const tx = photosDB.transaction(PHOTOS_STORE, 'readonly');
    const store = tx.objectStore(PHOTOS_STORE);
    const items = [];
    const req = store.openCursor();
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) {
        items.push({ id: cursor.key, blob: cursor.value });
        cursor.continue();
      } else {
        resolve(items);
      }
    };
    req.onerror = reject;
  });
}

async function deleteUserPhotoById(id) {
  if (!photosDB) return;
  const tx = photosDB.transaction(PHOTOS_STORE, 'readwrite');
  const store = tx.objectStore(PHOTOS_STORE);
  store.delete(id);
  return new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

// Modificar renderPhotoGallery para usar las claves
async function renderPhotoGallery() {
  const container = document.getElementById('photoGalleryContainer');
  if (!container) return;
  const photosWithKeys = await getAllUserPhotosWithKeys();
  container.innerHTML = '';
  if (photosWithKeys.length === 0) {
    container.innerHTML = '<div class="sett-desc" style="text-align:center">Aún no has subido fotos. ¡Sube las tuyas para verlas al ganar!</div>';
    return;
  }
  for (let item of photosWithKeys) {
    const blob = item.blob;
    const id = item.id;
    const url = URL.createObjectURL(blob);
    const div = document.createElement('div');
    div.className = 'photo-item';
    const img = document.createElement('img');
    img.src = url;
    const delBtn = document.createElement('div');
    delBtn.className = 'delete-photo';
    delBtn.textContent = '✕';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (confirm('¿Eliminar esta foto?')) {
        await deleteUserPhotoById(id);
        renderPhotoGallery();
      }
    };
    div.appendChild(img);
    div.appendChild(delBtn);
    container.appendChild(div);
    URL.revokeObjectURL(url);
  }
}

// Manejar la subida de múltiples fotos
function setupPhotoUpload() {
  const input = document.getElementById('photoUploadInput');
  if (!input) return;
  input.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        await saveUserPhoto(file);
      }
    }
    await renderPhotoGallery();
    input.value = ''; // limpiar
  });
}

  document.getElementById('confettiCanvas').style.display = 'block';

// Añadir al panel de ajustes la sección de fotos
function addPhotoSettingsPanel() {
  const settingsPanel = document.getElementById('panel-settings');
  if (!settingsPanel) return;
  const photoSection = document.createElement('div');
  photoSection.className = 'sett-section';
  photoSection.innerHTML = `
    <div class="sett-title">📸 MIS FOTOS DE VICTORIA</div>
    <div class="sett-desc">Sube tus imágenes favoritas. Aparecerán aleatoriamente cuando ganes una partida.</div>
    <input type="file" id="photoUploadInput" accept="image/*" multiple style="display:none">
    <button class="upload-btn" id="triggerUpload">➕ Subir fotos</button>
    <div id="photoGalleryContainer" class="photo-gallery"></div>
  `;
  settingsPanel.appendChild(photoSection);
  document.getElementById('triggerUpload').onclick = () => {
    document.getElementById('photoUploadInput').click();
  };
  setupPhotoUpload();
  renderPhotoGallery();
}

// Inicializar todo al cargar
window.addEventListener('DOMContentLoaded', async () => {
  await initPhotosDB();
  addPhotoSettingsPanel();
